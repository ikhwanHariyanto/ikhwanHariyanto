name: Update GitHub contribution graphic

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution graphic
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ikhwanHariyanto

      - name: Update contributor SVG
        shell: bash
        run: cp profile-3d-contrib/profile-gitblock.svg profile/contributor-animate.svg

      - name: Commit updated graphic
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub contribution graphic"
          file_pattern: profile/contributor-animate.svg