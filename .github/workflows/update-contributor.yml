name: Update GitHub contribution graphic

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate Gundam contribution graphic
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build profile-gitclock.svg
        shell: bash
        run: node scripts/generate-profile-gitclock.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ikhwanHariyanto

      - name: Commit updated graphic
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Gundam contribution clock"
          file_pattern: profile/profile-gitclock.svg